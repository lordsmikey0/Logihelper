<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logihelper</title>
    <link rel="stylesheet" href="/css/main.css?v=8">
    <script src="/js/main.js?v=9" defer></script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar" aria-label="Рабочая область">
            <div class="brand">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="5" y="5" width="14" height="14" rx="2"/>
                    <path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3M9 9h2v6h4"/>
                </svg>
                <div>
                    <span class="brand-name">Logihelper</span>
                    <span class="muted brand-caption">Ассистент по цифровой схемотехнике</span>
                </div>
            </div>
            <button class="chat-action history-toggle" id="history-toggle" type="button"
                    aria-expanded="false" aria-controls="chat-history">Чаты</button>
            <section class="sidebar-section" id="chat-history" aria-labelledby="recent-heading">
                <button class="chat-action new-chat" id="new-chat" type="button">+ Новый чат</button>
                <h2 id="recent-heading">Недавние чаты</h2>
                <ul class="chat-list" id="chat-list"></ul>
                <p class="muted history-note" id="empty-history">Чатов пока нет.</p>
                <p class="muted history-note" id="storage-status" role="status"></p>
            </section>
        </aside>

        <main class="workspace" aria-labelledby="chat-heading">
            <header class="workspace-header">
                <h1 id="chat-heading" tabindex="-1">Чат</h1>
            </header>
            <div class="conversation" id="conversation" tabindex="0" aria-label="Переписка">
                <div class="chat-column">
                    <div class="welcome" id="welcome">
                        <h2>Чем я могу вам помочь?</h2>
                        <p class="muted">Спрашивайте о цифровой логике, схемах или Logisim.</p>
                    </div>
                    <div class="messages" id="chat" role="log" aria-label="Сообщения"></div>
                </div>
            </div>
            <footer class="composer-area">
                <div class="chat-column">
                    <p class="chat-status muted" id="chat-status" role="status"></p>
                    <form class="composer" id="chat-form">
                        <textarea id="req-input" name="text" rows="2" required
                                  aria-label="Сообщение" placeholder="Спрашивайте о цифровой логике…"></textarea>
                        <button class="send-button" id="req-send" type="submit" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="m22 2-7 20-4-9-9-4 20-7ZM11 13 22 2"/>
                            </svg>
                            Отправить
                        </button>
                    </form>
                    <p class="composer-hint muted">Enter — отправить · Shift + Enter — новая строка</p>
                </div>
            </footer>
        </main>
    </div>
    <template id="waiting-message-template">
        <article class="message assistant">
            <header class="message-author">Logihelper</header>
            <div class="message-content message-waiting">
                <span class="waiting-spinner" aria-hidden="true"></span>
                <span>Ожидание ответа…</span>
            </div>
        </article>
    </template>
    <template id="chat-item-template">
        <li class="chat-item">
            <button class="chat-action chat-choice" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 15a3 3 0 0 1-3 3H9l-5 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/>
                </svg>
                <span class="chat-title"></span>
                <svg class="chat-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m16 3 5 5-3 1-3 5v3l-8-8h3l5-3 1-3ZM10 14l-6 6"/>
                </svg>
            </button>
            <button class="chat-action chat-menu-toggle" type="button" aria-expanded="false">⋯</button>
            <div class="chat-menu" hidden>
                <button class="chat-action" data-action="rename" type="button">Переименовать</button>
                <button class="chat-action" data-action="delete" type="button">Удалить</button>
                <button class="chat-action" data-action="pin" type="button">Закрепить</button>
            </div>
        </li>
    </template>
    <dialog class="chat-dialog" id="chat-dialog" aria-labelledby="dialog-heading">
        <form id="dialog-form">
            <h2 id="dialog-heading"></h2>
            <label id="rename-field">
                Название чата
                <input id="chat-name" type="text" maxlength="120" required>
            </label>
            <p id="delete-confirmation"></p>
            <div class="chat-actions">
                <button class="chat-action" id="cancel-dialog" type="button">Отмена</button>
                <button class="chat-action primary-action" id="confirm-dialog" type="submit"></button>
            </div>
        </form>
    </dialog>
</body>
</html>
