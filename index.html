<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logihelper</title>
    <link rel="stylesheet" href="/css/main.css?v=3">
    <script src="/js/main.js?v=3" defer></script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar" aria-label="Workspace">
            <div class="brand">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="5" y="5" width="14" height="14" rx="2"/>
                    <path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3M9 9h2v6h4"/>
                </svg>
                <div>
                    <span class="brand-name">Logihelper</span>
                    <span class="muted brand-caption">Digital logic assistant</span>
                </div>
            </div>
            <button class="chat-action history-toggle" id="history-toggle" type="button"
                    aria-expanded="false" aria-controls="chat-history">Chats</button>
            <section class="sidebar-section" id="chat-history" aria-labelledby="recent-heading">
                <button class="chat-action new-chat" id="new-chat" type="button">+ New chat</button>
                <h2 id="recent-heading">Recent chats</h2>
                <ul class="chat-list" id="chat-list"></ul>
                <p class="muted history-note" id="empty-history">No chats yet.</p>
                <p class="muted history-note" id="storage-status" role="status"></p>
            </section>
        </aside>

        <main class="workspace" aria-labelledby="chat-heading">
            <header class="workspace-header">
                <h1 id="chat-heading" tabindex="-1">Chat</h1>
                <div class="chat-actions" id="chat-actions" hidden>
                    <button class="chat-action" id="rename-chat" type="button">Rename</button>
                    <button class="chat-action" id="delete-chat" type="button">Delete</button>
                </div>
            </header>
            <div class="conversation" id="conversation" tabindex="0" aria-label="Conversation">
                <div class="chat-column">
                    <div class="welcome" id="welcome">
                        <h2>How can I help?</h2>
                        <p class="muted">Ask about digital logic, circuits, or Logisim.</p>
                    </div>
                    <div class="messages" id="chat" role="log" aria-label="Messages"></div>
                </div>
            </div>
            <footer class="composer-area">
                <div class="chat-column">
                    <p class="chat-status muted" id="chat-status" role="status"></p>
                    <form class="composer" id="chat-form">
                        <textarea id="req-input" name="text" rows="2" required
                                  aria-label="Message" placeholder="Ask anything about digital logic…"></textarea>
                        <button class="send-button" id="req-send" type="submit" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="m22 2-7 20-4-9-9-4 20-7ZM11 13 22 2"/>
                            </svg>
                            Send
                        </button>
                    </form>
                    <p class="composer-hint muted">Enter to send · Shift + Enter for a new line</p>
                </div>
            </footer>
        </main>
    </div>
    <dialog class="chat-dialog" id="chat-dialog" aria-labelledby="dialog-heading">
        <form id="dialog-form">
            <h2 id="dialog-heading"></h2>
            <label id="rename-field">
                Chat name
                <input id="chat-name" type="text" maxlength="120" required>
            </label>
            <p id="delete-confirmation"></p>
            <div class="chat-actions">
                <button class="chat-action" id="cancel-dialog" type="button">Cancel</button>
                <button class="chat-action primary-action" id="confirm-dialog" type="submit"></button>
            </div>
        </form>
    </dialog>
</body>
</html>
