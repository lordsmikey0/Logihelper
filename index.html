<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Logihelper</title>
    <link rel="stylesheet" href="css/main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
    <div class="layout">
        <div class="left_panel" id="left-panel">
            <p class="logo_left_panel">Logihelper Assistant</p>
            <p class="logo_left_panel_bottom">How can I help you?</p>
            <div class="button_left_panel"></div>
            <div class="button_left_panel"></div>
            <div class="button_left_panel"></div>
            <div class="button_left_panel"></div>
            <div class="button_left_panel"></div>
            <div class="button_left_panel"></div>
            <div class="button_left_panel"></div>
            <div class="button_left_panel"></div>
            <div class="button_left_panel"></div>
        </div>
        <div class="main_content">
            <p class="project_name">LOGIHELPER</p>
            <form>
                <button type="button" class="button" id="add-file">Add file</button>
                <label>
                    <input
                        type="text"
                        name="text"
                        placeholder="Enter Request"
                        id="req-input"
                    >
                </label>
                <button type="button" class="button" id="req-send">Send</button>
            </form>
            <div class="chat" id="chat">----How can I help you?----</div>
            <p class="await_response">Assistant is working . . .</p>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
